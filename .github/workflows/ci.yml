# 每次 push 和 PR：在 macOS 上编译、跑自检、渲染预览图；另外把 .githooks/pre-commit 的隐私规则在服务器上再查一遍。
# 云端会话没有 Swift，改了 Swift 代码推上来后看这里的结果就知道能不能编译、自检过没过。
# 公开仓库用 GitHub 自带的 macOS runner 不花钱。
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 编译 + 自检
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: QuotaPet
    steps:
      - uses: actions/checkout@v5

      # 出错的地方都写成注解（::error）：云端会话打不开 Actions 的日志，但能用 gh api 读 check run 的注解
      - name: Swift 版本
        run: echo "::notice title=Swift::$(swift --version 2>&1 | head -1)"

      # make check 只编译 QuotaPetCore 和自检，App 本体（界面代码）的编译错误要靠这一步发现
      - name: 编译所有 target
        run: |
          set -o pipefail
          if swift build 2>&1 | tee "$RUNNER_TEMP/build.log"; then exit 0; fi
          # bash -e + pipefail：grep 没找到时返回 1 会直接退出，走不到下面的兜底，所以都要 || true
          errors=$(grep -E '^/.+:[0-9]+:[0-9]+: error: ' "$RUNNER_TEMP/build.log" | sort -u | head -30 || true)
          if [ -z "$errors" ]; then
            echo "::error title=swift build 失败::$(tail -25 "$RUNNER_TEMP/build.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          fi
          printf '%s\n' "$errors" | while IFS= read -r l; do
            [ -n "$l" ] || continue
            file=${l%%:*}; rest=${l#*:}; line=${rest%%:*}; msg=${l#*: error: }
            echo "::error file=${file#$GITHUB_WORKSPACE/},line=$line::$msg"
          done
          exit 1

      # 自检用了 @testable import，只能 debug 构建，不要加 -c release
      - name: 自检
        run: |
          set -o pipefail
          if make check 2>&1 | tee "$RUNNER_TEMP/check.log"; then exit 0; fi
          { grep -E '^✗ ' "$RUNNER_TEMP/check.log" || true; } | head -30 | while IFS= read -r l; do
            n=$(printf '%s' "$l" | sed -nE 's/^✗ 第 ([0-9]+) 行：.*/\1/p')
            if [ -n "$n" ]; then echo "::error file=QuotaPet/Sources/QuotaPetChecks/main.swift,line=$n::$l"; else echo "::error::$l"; fi
          done
          grep -qE '^✗ ' "$RUNNER_TEMP/check.log" ||
            echo "::error title=自检失败::$(tail -25 "$RUNNER_TEMP/check.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          exit 1

      # 预览图都是假数据，只有 popover-live* 读本机真实额度；runner 上没有真实数据，但还是删掉，免得以后误传
      - name: 渲染预览图
        id: previews
        continue-on-error: true
        run: |
          swift run -c release QuotaPet --render-previews build/previews
          rm -f build/previews/popover-live*

      - name: 上传预览图
        if: steps.previews.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: previews
          path: QuotaPet/build/previews
          retention-days: 14

  privacy:
    name: 隐私检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 和 .githooks/pre-commit 同一套规则。本机的钩子要每个 clone 手动启用，在别的电脑、网页上或者云端提交时可能没开，这里兜底
      - name: 不能有真实数据或截图
        run: |
          bad=$(git -c core.quotePath=false ls-files |
            grep -iE '\.jsonl($|\.)|(^|/)popover-live[^/]*\.png$|(^|/)(snapshots|intervals|plan-usage-history)[^/]*$|screenshot|screen shot|cleanshot|截屏|屏幕快照' || true)
          if [ -n "$bad" ]; then
            echo "::error::这些文件可能是真实数据或截图："; echo "$bad"; exit 1
          fi

      # 自检里用的假路径（/Users/a、/Users/someone）放行
      - name: 不能有本机绝对路径
        run: |
          hits=$(git grep -I -nE '/Users/[A-Za-z0-9._-]{2,}|\\/Users\\/[A-Za-z0-9._-]{2,}' |
            grep -vE '/Users/someone|\\/Users\\/someone' || true)
          if [ -n "$hits" ]; then
            echo "::error::文件里有本机绝对路径，换成 ~ 或删掉："; echo "$hits" | cut -c1-200; exit 1
          fi

      # 只查这次新加的提交；GitHub 网页上合并、编辑时提交者是 noreply@github.com，也放行
      - name: 提交邮箱要用 noreply
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$HEAD_SHA -1"
          else
            range="$BEFORE..$HEAD_SHA"
          fi
          bad=$(git log --format='%h %ae %ce' $range |
            awk '{ for (i = 2; i <= 3; i++) if ($i !~ /@users\.noreply\.github\.com$/ && $i != "noreply@github.com") { print; next } }')
          if [ -n "$bad" ]; then
            echo "::error::这些提交的作者或提交者邮箱不是 GitHub noreply 地址："; echo "$bad"; exit 1
          fi
